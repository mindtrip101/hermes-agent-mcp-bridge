[project]
name = "hermes-agent-mcp-bridge"
version = "0.1.0"
description = "OAuth 2.1 MCP bridge that queues prompts to a local Hermes agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "pydantic>=2",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
hermes-agent-mcp-bridge = "hermes_agent_mcp_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_agent_mcp_bridge*"]

[tool.ruff]
line-length = 150
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]
