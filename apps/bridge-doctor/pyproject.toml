[project]
name = "hermes-bridge-doctor"
version = "0.1.0"
description = "Setup checker for a hermes-agent-mcp-bridge install."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
hermes-bridge-doctor = "hermes_bridge_doctor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_bridge_doctor*"]
