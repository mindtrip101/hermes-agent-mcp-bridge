[project]
name = "hermes-bridge-status-board"
version = "0.1.0"
description = "Connector profile and notes for the bridge status tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-status-board = "hermes_status_board.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_status_board*"]
